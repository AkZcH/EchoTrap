services:
  echotrap:
    build: .
    container_name: echotrap
    restart: unless-stopped
    ports:
      - "9000:9000" # honeypot
      - "8081:8081" # dashboard
    environment:
      - RUST_LOG=info
    command:
      - echotrap
      - --port=9000
      - --threshold=3
      - --window=10
      - --persona=ssh
      - --max-connections=10000
      - --dashboard-port=8081
      - --log=/home/echotrap/echotrap.log
    volumes:
      - echotrap-logs:/home/echotrap
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional: Prometheus scrape target.
  # Uncomment and add prometheus.yml to enable metrics collection.
  # prometheus:
  #   image: prom/prometheus:latest
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"

volumes:
  echotrap-logs:
